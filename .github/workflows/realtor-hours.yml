name: PRIME CITY Realtor Hours

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-6'
      timezone: Europe/London
    - cron: '0 13 * * 0'
      timezone: Europe/London

permissions:
  contents: read

jobs:
  post-hours:
    runs-on: ubuntu-latest
    steps:
      - name: Post daily business hours
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          const tz = "Europe/London";
          const now = new Date();

          const day = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            weekday: "short"
          }).format(now);

          const sunday = day === "Sun";
          const hour = sunday ? 15 : 18;

          const p = Object.fromEntries(
            new Intl.DateTimeFormat("en-GB", {
              timeZone: tz,
              year: "numeric",
              month: "2-digit",
              day: "2-digit"
            }).formatToParts(now).map(x => [x.type, x.value])
          );

          const target = Date.UTC(+p.year, +p.month - 1, +p.day, hour);
          let close = new Date(target);

          for (let i = 0; i < 3; i++) {
            const shown = new Intl.DateTimeFormat("en-GB", {
              timeZone: tz,
              year: "numeric", month: "2-digit",
              day: "2-digit", hour: "2-digit",
              minute: "2-digit", hourCycle: "h23"
            }).formatToParts(close);
            const v = Object.fromEntries(shown.map(x => [x.type, x.value]));
            const actual = Date.UTC(+v.year, +v.month - 1, +v.day, +v.hour, +v.minute);
            close = new Date(close.getTime() + target - actual);
          }

          const stamp = Math.floor(close.getTime() / 1000);

          const message = sunday
            ? `# 🏡 PRIME CITY REAL ESTATE\n🟠 **EMERGENCY ONLY**\n\nHours: 1 PM – 3 PM UK time\n\n⏳ Closing in: <t:${stamp}:R>\n🔴 Closing: <t:${stamp}:t>`
            : `# 🏡 PRIME CITY REAL ESTATE\n🟢 **OPEN**\n\nHours: 9 AM – 6 PM UK time\n\n⏳ Closing in: <t:${stamp}:R>\n🔴 Closing: <t:${stamp}:t>`;

          fetch(process.env.DISCORD_WEBHOOK_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({content: message})
          }).then(r => {
            if (!r.ok) throw new Error("Discord webhook failed: " + r.status);
          }).catch(e => {
            console.error(e);
            process.exit(1);
          });
          NODE