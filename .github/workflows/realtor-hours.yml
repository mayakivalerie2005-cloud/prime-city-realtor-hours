
name: PRIME CITY Realtor Hours

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 1-6'
      timezone: Africa/Lagos
    - cron: '0 13 * * 0'
      timezone: Africa/Lagos
    - cron: '0 18 * * 1-6'
      timezone: Africa/Lagos
    - cron: '0 15 * * 0'
      timezone: Africa/Lagos

permissions:
  contents: read
  actions: write

concurrency:
  group: prime-city-realtor-hours
  cancel-in-progress: false

jobs:
  post-hours:
    runs-on: ubuntu-latest

    steps:
      - name: Create or update business-hours announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node <<'NODE'
          const tz = "Africa/Lagos";
          const variableName = "PRIME_CITY_HOURS_MESSAGE_ID";
          const now = new Date();
          const schedule = process.env.GITHUB_EVENT_SCHEDULE || "";

          const webhook = process.env.DISCORD_WEBHOOK_URL;
          const token = process.env.GITHUB_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;

          if (!webhook || !token || !repo) {
            throw new Error("A required webhook or GitHub environment value is missing.");
          }

          function getParts(date) {
            return Object.fromEntries(
              new Intl.DateTimeFormat("en-GB", {
                timeZone: tz,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                weekday: "short",
                hourCycle: "h23"
              }).formatToParts(date).map(x => [x.type, x.value])
            );
          }

          function localToUTC(year, month, day, hour, minute) {
            const target = Date.UTC(year, month - 1, day, hour, minute);
            let result = new Date(target);

            for (let i = 0; i < 3; i++) {
              const p = getParts(result);
              const actual = Date.UTC(
                Number(p.year),
                Number(p.month) - 1,
                Number(p.day),
                Number(p.hour),
                Number(p.minute)
              );
              result = new Date(result.getTime() + target - actual);
            }

            return result;
          }

          const p = getParts(now);
          const year = Number(p.year);
          const month = Number(p.month);
          const day = Number(p.day);
          const weekday = p.weekday;
          const isSunday = weekday === "Sun";

          const openingHour = isSunday ? 13 : 9;
          const closingHour = isSunday ? 15 : 18;

          const currentMinutes =
            Number(p.hour) * 60 + Number(p.minute);

          let isOpen =
            currentMinutes >= openingHour * 60 &&
            currentMinutes < closingHour * 60;

          const openingSchedule = isSunday
            ? "0 13 * * 0"
            : "0 9 * * 1-6";

          const closingSchedule = isSunday
            ? "0 15 * * 0"
            : "0 18 * * 1-6";

          if (schedule === openingSchedule) isOpen = true;
          if (schedule === closingSchedule) isOpen = false;

          const dayLabel = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            weekday: "long"
          }).format(now).toUpperCase();

          const dateLabel = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            day: "numeric",
            month: "long",
            year: "numeric"
          }).format(now).toUpperCase();

          const openStamp = Math.floor(
            localToUTC(year, month, day, openingHour, 0).getTime() / 1000
          );

          const closeStamp = Math.floor(
            localToUTC(year, month, day, closingHour, 0).getTime() / 1000
          );

          // Find the next opening time if the office is closed.
          let nextOpenStamp = openStamp;

          if (!isOpen) {
            for (let offset = 0; offset <= 7; offset++) {
              const candidate = new Date(
                Date.UTC(year, month - 1, day + offset)
              );

              const cy = candidate.getUTCFullYear();
              const cm = candidate.getUTCMonth() + 1;
              const cd = candidate.getUTCDate();

              const candidateNoon = localToUTC(cy, cm, cd, 12, 0);
              const candidateDay = getParts(candidateNoon).weekday;
              const candidateHour = candidateDay === "Sun" ? 13 : 9;

              const candidateOpening = localToUTC(
                cy, cm, cd, candidateHour, 0
              );

              if (candidateOpening.getTime() > now.getTime()) {
                nextOpenStamp = Math.floor(
                  candidateOpening.getTime() / 1000
                );
                break;
              }
            }
          }

          const description = isOpen
            ? isSunday
              ? "🟠 **EMERGENCY SERVICES OPEN**\n\nOur emergency property service is currently available."
              : "🟢 **OFFICE OPEN**\n\nWelcome to PRIME CITY REAL ESTATE. Our team is ready to assist you."
            : "🔴 **OFFICE CLOSED**\n\nThank you for choosing PRIME CITY REAL ESTATE. We look forward to assisting you.";

          const fields = [
            {
              name: "📅 DAY",
              value: `**${dayLabel}**`,
              inline: true
            },
            {
              name: "🗓️ DATE",
              value: dateLabel,
              inline: true
            },
            {
              name: "🕒 BUSINESS HOURS",
              value: isSunday
                ? "1:00 PM – 3:00 PM WAT\n**Emergency Only**"
                : "9:00 AM – 6:00 PM WAT\n**Monday – Saturday**",
              inline: false
            }
          ];

          if (isOpen) {
            fields.push(
              {
                name: "⏳ TIME UNTIL CLOSING",
                value: `<t:${closeStamp}:R>`,
                inline: true
              },
              {
                name: "🔔 CLOSING TIME",
                value: `<t:${closeStamp}:t>`,
                inline: true
              }
            );
          } else {
            fields.push({
              name: "⏳ NEXT OPENING",
              value: `<t:${nextOpenStamp}:F>\n<t:${nextOpenStamp}:R>`,
              inline: false
            });
          }

          const embed = {
            title: `🏡 PRIME CITY REAL ESTATE | ${dayLabel}`,
            description,
            color: isOpen ? 0xB22222 : 0x555555,
            fields,
            footer: {
              text: "PRIME CITY REAL ESTATE • Official Business Hours • WAT"
            },
            timestamp: now.toISOString()
          };

          const githubHeaders = {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json"
          };

          const variableUrl =
            `https://api.github.com/repos/${repo}/actions/variables/${variableName}`;

          async function getMessageId() {
            const response = await fetch(variableUrl, {
              headers: githubHeaders
            });

            if (response.status === 404) return null;

            if (!response.ok) {
              throw new Error("Could not read GitHub message ID variable: " + response.status);
            }

            const data = await response.json();
            return data.value;
          }

          async function saveMessageId(messageId, exists) {
            const url = exists
              ? variableUrl
              : `https://api.github.com/repos/${repo}/actions/variables`;

            const response = await fetch(url, {
              method: exists ? "PATCH" : "POST",
              headers: githubHeaders,
              body: JSON.stringify({
                name: variableName,
                value: messageId
              })
            });

            if (!response.ok) {
              throw new Error("Could not save GitHub message ID: " + response.status);
            }
          }

          async function createMessage() {
            const response = await fetch(`${webhook}?wait=true`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                embeds: [embed],
                allowed_mentions: { parse: [] }
              })
            });

            if (!response.ok) {
              throw new Error("Discord message creation failed: " + response.status);
            }

            return await response.json();
          }

          async function editMessage(messageId) {
            const response = await fetch(
              `${webhook}/messages/${messageId}`,
              {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  embeds: [embed],
                  allowed_mentions: { parse: [] }
                })
              }
            );

            return response;
          }

          async function main() {
            const messageId = await getMessageId();

            if (messageId) {
              const response = await editMessage(messageId);

              if (response.ok) {
                console.log("Existing PRIME CITY announcement updated.");
                return;
              }

              if (response.status !== 404) {
                throw new Error("Discord message edit failed: " + response.status);
              }

              console.log("Saved message no longer exists. Creating a replacement.");
            }

            const message = await createMessage();

            if (!message.id) {
              throw new Error("Discord did not return a message ID.");
            }

            await saveMessageId(message.id, Boolean(messageId));

            console.log("PRIME CITY announcement created and its ID saved.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
