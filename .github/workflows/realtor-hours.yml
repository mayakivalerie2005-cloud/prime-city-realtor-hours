
name: PRIME CITY Realtor Hours

on:
  workflow_dispatch:

  schedule:
    # Monday to Saturday opening: 09:00 WAT
    - cron: '0 9 * * 1-6'
      timezone: Africa/Lagos

    # Sunday emergency opening: 13:00 WAT
    - cron: '0 13 * * 0'
      timezone: Africa/Lagos

    # Monday to Saturday closing: 18:00 WAT
    - cron: '0 18 * * 1-6'
      timezone: Africa/Lagos

    # Sunday emergency closing: 15:00 WAT
    - cron: '0 15 * * 0'
      timezone: Africa/Lagos

permissions:
  contents: read

jobs:
  post-hours:
    runs-on: ubuntu-latest

    steps:
      - name: Post PRIME CITY business hours
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node <<'NODE'
          const tz = "Africa/Lagos";
          const now = new Date();
          const schedule = process.env.GITHUB_EVENT_SCHEDULE || "";

          function getParts(date) {
            return Object.fromEntries(
              new Intl.DateTimeFormat("en-GB", {
                timeZone: tz,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                weekday: "short",
                hourCycle: "h23"
              }).formatToParts(date).map(x => [x.type, x.value])
            );
          }

          function localToUTC(year, month, day, hour, minute) {
            const target = Date.UTC(year, month - 1, day, hour, minute);
            let result = new Date(target);

            for (let i = 0; i < 3; i++) {
              const p = getParts(result);
              const actual = Date.UTC(
                Number(p.year),
                Number(p.month) - 1,
                Number(p.day),
                Number(p.hour),
                Number(p.minute)
              );
              result = new Date(result.getTime() + target - actual);
            }

            return result;
          }

          const p = getParts(now);

          const year = Number(p.year);
          const month = Number(p.month);
          const day = Number(p.day);
          const weekday = p.weekday;

          const isSunday = weekday === "Sun";

          const openingHour = isSunday ? 13 : 9;
          const closingHour = isSunday ? 15 : 18;

          const currentMinutes =
            Number(p.hour) * 60 + Number(p.minute);

          const openingMinutes = openingHour * 60;
          const closingMinutes = closingHour * 60;

          const openStamp = Math.floor(
            localToUTC(year, month, day, openingHour, 0).getTime() / 1000
          );

          const closeStamp = Math.floor(
            localToUTC(year, month, day, closingHour, 0).getTime() / 1000
          );

          // Make the weekday and date very visible.
          const dayLabel = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            weekday: "long"
          }).format(now).toUpperCase();

          const dateLabel = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            day: "numeric",
            month: "long",
            year: "numeric"
          }).format(now).toUpperCase();

          const openingSchedule = isSunday
            ? "0 13 * * 0"
            : "0 9 * * 1-6";

          const closingSchedule = isSunday
            ? "0 15 * * 0"
            : "0 18 * * 1-6";

          let isOpen =
            currentMinutes >= openingMinutes &&
            currentMinutes < closingMinutes;

          // Respect scheduled opening and closing announcements.
          if (schedule === openingSchedule) {
            isOpen = true;
          }

          if (schedule === closingSchedule) {
            isOpen = false;
          }

          // Calculate the next opening if the office is closed.
          let nextOpenStamp = openStamp;

          if (!isOpen && currentMinutes >= closingMinutes) {
            for (let offset = 1; offset <= 7; offset++) {
              const nextDate = new Date(
                Date.UTC(year, month - 1, day + offset)
              );

              const nextYear = nextDate.getUTCFullYear();
              const nextMonth = nextDate.getUTCMonth() + 1;
              const nextDay = nextDate.getUTCDate();

              const nextWeekday = new Intl.DateTimeFormat("en-GB", {
                timeZone: tz,
                weekday: "short"
              }).format(
                localToUTC(nextYear, nextMonth, nextDay, 12, 0)
              );

              const nextOpeningHour = nextWeekday === "Sun" ? 13 : 9;

              nextOpenStamp = Math.floor(
                localToUTC(
                  nextYear,
                  nextMonth,
                  nextDay,
                  nextOpeningHour,
                  0
                ).getTime() / 1000
              );

              break;
            }
          }

          const title = `🏡 PRIME CITY REAL ESTATE | ${dayLabel}`;

          const description = isOpen
            ? isSunday
              ? "🟠 **EMERGENCY SERVICES OPEN**\n\nOur emergency property service is currently available."
              : "🟢 **OFFICE OPEN**\n\nWelcome to PRIME CITY REAL ESTATE. Our team is ready to assist you."
            : "🔴 **OFFICE CLOSED**\n\nThank you for choosing PRIME CITY REAL ESTATE. We look forward to assisting you.";

          const fields = [
            {
              name: "📅 DAY",
              value: `**${dayLabel}**`,
              inline: true
            },
            {
              name: "🗓️ DATE",
              value: dateLabel,
              inline: true
            },
            {
              name: "🕒 BUSINESS HOURS",
              value: isSunday
                ? "1:00 PM – 3:00 PM WAT\n**Emergency Only**"
                : "9:00 AM – 6:00 PM WAT\n**Monday – Saturday**",
              inline: false
            }
          ];

          if (isOpen) {
            fields.push(
              {
                name: "⏳ TIME UNTIL CLOSING",
                value: `<t:${closeStamp}:R>`,
                inline: true
              },
              {
                name: "🔔 CLOSING TIME",
                value: `<t:${closeStamp}:t>`,
                inline: true
              }
            );
          } else {
            fields.push({
              name: "⏳ NEXT OPENING",
              value: `<t:${nextOpenStamp}:F>\n<t:${nextOpenStamp}:R>`,
              inline: false
            });
          }

          const embed = {
            title: title,
            description: description,
            color: isOpen ? 0xB22222 : 0x555555,
            fields: fields,
            footer: {
              text: "PRIME CITY REAL ESTATE • Official Business Hours • WAT"
            },
            timestamp: now.toISOString()
          };

          async function sendAnnouncement() {
            if (!process.env.DISCORD_WEBHOOK_URL) {
              throw new Error("DISCORD_WEBHOOK_URL secret is missing.");
            }

            const response = await fetch(
              process.env.DISCORD_WEBHOOK_URL,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  embeds: [embed],
                  allowed_mentions: {
                    parse: []
                  }
                })
              }
            );

            if (!response.ok) {
              throw new Error(
                "Discord webhook failed: " + response.status
              );
            }

            console.log("PRIME CITY announcement posted successfully.");
          }

          sendAnnouncement().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
