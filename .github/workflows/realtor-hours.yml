
name: PRIME CITY Realtor Hours

on:
  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: prime-city-realtor-hours
  cancel-in-progress: false

jobs:
  post-hours:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Create or update business-hours announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const tz = "Africa/Lagos";
          const now = new Date();
          const webhook = process.env.DISCORD_WEBHOOK_URL;
          const idFile = ".github/prime-city-message-id.txt";

          if (!webhook) {
            throw new Error("DISCORD_WEBHOOK_URL secret is missing.");
          }

          function getParts(date) {
            return Object.fromEntries(
              new Intl.DateTimeFormat("en-GB", {
                timeZone: tz,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                weekday: "short",
                hourCycle: "h23"
              }).formatToParts(date).map(x => [x.type, x.value])
            );
          }

          function localToUTC(year, month, day, hour, minute) {
            const target = Date.UTC(year, month - 1, day, hour, minute);
            let result = new Date(target);

            for (let i = 0; i < 3; i++) {
              const p = getParts(result);

              const actual = Date.UTC(
                Number(p.year),
                Number(p.month) - 1,
                Number(p.day),
                Number(p.hour),
                Number(p.minute)
              );

              result = new Date(result.getTime() + target - actual);
            }

            return result;
          }

          const p = getParts(now);

          const year = Number(p.year);
          const month = Number(p.month);
          const day = Number(p.day);
          const weekday = p.weekday;

          const isSunday = weekday === "Sun";

          const openingHour = isSunday ? 13 : 9;
          const closingHour = isSunday ? 15 : 18;

          const currentMinutes =
            Number(p.hour) * 60 + Number(p.minute);

          const openingMinutes = openingHour * 60;
          const closingMinutes = closingHour * 60;

          const isOpen =
            currentMinutes >= openingMinutes &&
            currentMinutes < closingMinutes;

          const isEmergency = isSunday && isOpen;

          const dayLabel = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            weekday: "long"
          }).format(now).toUpperCase();

          const dateLabel = new Intl.DateTimeFormat("en-GB", {
            timeZone: tz,
            day: "numeric",
            month: "long",
            year: "numeric"
          }).format(now).toUpperCase();

          // Today's opening and closing timestamps.
          // Discord converts these automatically for each viewer.
          const openStamp = Math.floor(
            localToUTC(
              year, month, day, openingHour, 0
            ).getTime() / 1000
          );

          const closeStamp = Math.floor(
            localToUTC(
              year, month, day, closingHour, 0
            ).getTime() / 1000
          );

          // Calculate the next opening when the office is closed.
          let nextOpenStamp = null;

          if (!isOpen) {
            for (let offset = 0; offset <= 7; offset++) {
              const candidateDate = new Date(
                Date.UTC(year, month - 1, day + offset)
              );

              const cy = candidateDate.getUTCFullYear();
              const cm = candidateDate.getUTCMonth() + 1;
              const cd = candidateDate.getUTCDate();

              const noon = localToUTC(cy, cm, cd, 12, 0);
              const candidateWeekday = getParts(noon).weekday;

              const nextOpeningHour =
                candidateWeekday === "Sun" ? 13 : 9;

              const candidateOpening = localToUTC(
                cy, cm, cd, nextOpeningHour, 0
              );

              if (candidateOpening.getTime() > now.getTime()) {
                nextOpenStamp = Math.floor(
                  candidateOpening.getTime() / 1000
                );
                break;
              }
            }
          }

          let status;
          let statusDescription;
          let colour;

          if (isEmergency) {
            status = "🟠 EMERGENCY SERVICES OPEN";
            statusDescription =
              "Urgent property-related matters may be reviewed, subject to staff availability.";
            colour = 0xF39C12;
          } else if (isOpen) {
            status = "🟢 OFFICE OPEN";
            statusDescription =
              "Our real estate agents are available to assist you.";
            colour = 0x2ECC71;
          } else {
            status = "🔴 OFFICE CLOSED";
            statusDescription =
              "Regular property services are currently unavailable.";
            colour = 0xB22222;
          }

          const todayHours = isSunday
            ? `🟠 **Emergency Only**\nOpening: <t:${openStamp}:t>\nClosing: <t:${closeStamp}:t>`
            : `Opening: <t:${openStamp}:t>\nClosing: <t:${closeStamp}:t>`;

          const fields = [
            {
              name: "📅 DAY",
              value: `**${dayLabel}**`,
              inline: true
            },
            {
              name: "🗓️ DATE",
              value: dateLabel,
              inline: true
            },
            {
              name: "⏰ BUSINESS STATUS",
              value: `**${status}**\n${statusDescription}`,
              inline: false
            },
            {
              name: "🕒 TODAY'S HOURS",
              value: todayHours,
              inline: false
            }
          ];

          if (isOpen) {
            fields.push({
              name: "⏳ TIME UNTIL CLOSING",
              value: `<t:${closeStamp}:R>`,
              inline: false
            });
          } else if (nextOpenStamp) {
            fields.push({
              name: "⏳ NEXT OPENING",
              value: `<t:${nextOpenStamp}:F>\n<t:${nextOpenStamp}:R>`,
              inline: false
            });
          }

          const embed = {
            title: `👑 PRIME CITY REAL ESTATE | ${dayLabel}`,
            description:
              "🏡 **LIVE BUSINESS STATUS**\n\n" +
              "Your PRIME CITY real estate team is here to assist with property purchases, sales, viewings and enquiries.",
            color: colour,
            fields,
            footer: {
              text: "PRIME CITY REAL ESTATE • OFFICIAL STATUS • WAT"
            },
            timestamp: now.toISOString()
          };

          async function createMessage() {
            const response = await fetch(`${webhook}?wait=true`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                embeds: [embed],
                allowed_mentions: { parse: [] }
              })
            });

            if (!response.ok) {
              throw new Error(
                "Discord creation failed: " +
                response.status + " " + await response.text()
              );
            }

            return await response.json();
          }

          async function editMessage(messageId) {
            return await fetch(
              `${webhook}/messages/${messageId}`,
              {
                method: "PATCH",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  embeds: [embed],
                  allowed_mentions: { parse: [] }
                })
              }
            );
          }

          async function main() {
            fs.mkdirSync(".github", { recursive: true });

            let messageId = null;

            if (fs.existsSync(idFile)) {
              messageId = fs.readFileSync(idFile, "utf8").trim();
            }

            if (messageId) {
              const response = await editMessage(messageId);

              if (response.ok) {
                console.log("Existing announcement updated successfully.");
                return;
              }

              if (response.status !== 404) {
                throw new Error(
                  "Discord edit failed: " +
                  response.status + " " + await response.text()
                );
              }

              console.log("Old message not found. Creating replacement.");
            }

            const message = await createMessage();

            if (!message.id) {
              throw new Error("Discord did not return a message ID.");
            }

            fs.writeFileSync(idFile, message.id + "\n");

            console.log("New announcement created.");
            console.log("New message ID saved.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save announcement ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/prime-city-message-id.txt

          if ! git diff --cached --quiet; then
            git commit -m "Save PRIME CITY announcement message ID"
            git push
          else
            echo "Message ID already saved."
          fi

