
name: PRIME CITY - Weekly Payday Countdown

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-city-payday
  cancel-in-progress: false

jobs:
  payday-announcement:
    name: Update Discord Payday Announcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update payday announcement
        env:
          WEBHOOK_URL: ${{ secrets.PAYROLL_DISCORD_WEBHOOK_URL }}

        run: |
          node <<'NODE'
          const https = require('https');
          const fs = require('fs');

          const webhook = process.env.WEBHOOK_URL;
          const idFile = 'state/payday-message-id.txt';

          if (!webhook) {
            throw new Error('PAYROLL_DISCORD_WEBHOOK_URL is missing.');
          }

          function send(url, method, body) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const data = JSON.stringify(body);

              const req = https.request({
                hostname: u.hostname,
                path: u.pathname + u.search,
                method,
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(data),
                  'User-Agent': 'PRIME-CITY-Payroll-Bot'
                }
              }, res => {
                let response = '';

                res.on('data', chunk => response += chunk);

                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    const error = new Error(
                      `Discord HTTP ${res.statusCode}: ${response}`
                    );
                    error.statusCode = res.statusCode;
                    reject(error);
                    return;
                  }

                  resolve(response ? JSON.parse(response) : {});
                });
              });

              req.on('error', reject);
              req.write(data);
              req.end();
            });
          }

          function getNextSunday() {
            const now = new Date();

            const formatter = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Africa/Lagos',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            });

            const parts = Object.fromEntries(
              formatter.formatToParts(now).map(p => [p.type, p.value])
            );

            const date = new Date(Date.UTC(
              Number(parts.year),
              Number(parts.month) - 1,
              Number(parts.day)
            ));

            const days = (7 - date.getUTCDay()) % 7;

            date.setUTCDate(date.getUTCDate() + days);

            // Official payday: Sunday, 8 PM Nigeria time.
            // Nigeria time is UTC+1.
            let target = Date.UTC(
              date.getUTCFullYear(),
              date.getUTCMonth(),
              date.getUTCDate(),
              19, 0, 0
            );

            // If today's payday has passed, use next Sunday.
            if (target <= now.getTime()) {
              target += 7 * 86400000;
            }

            return Math.floor(target / 1000);
          }

          async function main() {
            const payment = getNextSunday();

            const portal =
              'https://mayakivalerie2005-cloud.github.io/prime-city-realtor-hours/prime-city-agent-payroll/';

            const payload = {
              username: 'PRIME CITY | FINANCE',

              embeds: [{
                title: '👑 PRIME CITY REAL ESTATE',

                description:
                  '**WEEKLY AGENT PAYROLL**\n' +
                  '━━━━━━━━━━━━━━━━━━━━\n\n' +

                  'Your weekly commission payment is scheduled according to the official PRIME CITY payroll calendar.\n\n' +

                  '**💰 PAYMENT SCHEDULE**\n' +
                  'Payment frequency: Every Sunday\n' +
                  'Official payment time: 8:00 PM WAT\n\n' +

                  '**📅 NEXT PAYDAY**\n' +
                  `<t:${payment}:D>\n` +
                  `🕗 <t:${payment}:t> (your local time)\n\n` +

                  '**⏳ COUNTDOWN TO PAYMENT**\n' +
                  `<t:${payment}:R>\n\n` +

                  '━━━━━━━━━━━━━━━━━━━━\n\n' +

                  '**📂 AGENT PAYROLL PORTAL**\n' +
                  'Access your payroll information and payment records below.\n' +
                  `🔗 [OPEN PAYROLL PORTAL](${portal})`,

                color: 14269269,

                footer: {
                  text: 'PRIME CITY REAL ESTATE • FINANCE & ADMINISTRATION'
                },

                timestamp: new Date().toISOString()
              }]
            };

            const base = new URL(webhook);

            let messageId = fs.existsSync(idFile)
              ? fs.readFileSync(idFile, 'utf8').trim()
              : '';

            let result;

            if (messageId) {
              console.log('Updating existing announcement...');

              const editUrl = new URL(base.toString());

              editUrl.pathname =
                editUrl.pathname.replace(/\/$/, '') +
                '/messages/' + messageId;

              try {
                result = await send(
                  editUrl.toString(),
                  'PATCH',
                  payload
                );
              } catch (error) {
                if (error.statusCode !== 404) {
                  throw error;
                }

                console.log('Old announcement not found. Creating a new one.');
                messageId = '';
              }
            }

            if (!messageId) {
              console.log('Creating first announcement...');

              const postUrl = new URL(base.toString());
              postUrl.searchParams.set('wait', 'true');

              result = await send(
                postUrl.toString(),
                'POST',
                payload
              );

              if (!result.id) {
                throw new Error('Discord did not return a message ID.');
              }

              fs.mkdirSync('state', { recursive: true });

              fs.writeFileSync(idFile, result.id + '\n');

              console.log('Announcement ID saved:', result.id);
            }

            console.log('PRIME CITY payday announcement updated successfully.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save announcement ID
        run: |
          if [[ -n "$(git status --porcelain -- state/payday-message-id.txt)" ]]; then
            git config user.name "PRIME CITY Payroll Bot"
            git config user.email "payroll-bot@users.noreply.github.com"

            git add state/payday-message-id.txt
            git commit -m "Save PRIME CITY payroll announcement ID"
            git push
          fi

