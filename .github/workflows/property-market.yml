
name: PRIME CITY - Weekly Property Market

on:
  schedule:
    # Every Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-city-property-market
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update PRIME CITY weekly market
        env:
          PROPERTY_MARKET_DISCORD_WEBHOOK_URL: ${{ secrets.PROPERTY_MARKET_DISCORD_WEBHOOK_URL }}
        run: python scripts/property_market.py

      - name: Save weekly market state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_state.json
          git diff --cached --quiet || git commit -m "Update PRIME CITY weekly market"
          git push

