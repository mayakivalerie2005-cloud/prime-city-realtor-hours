
name: PRIME CITY - Weekly Payday Countdown

on:
  schedule:
    # Daily at 8:05 PM WAT
    - cron: '5 19 * * *'

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: prime-city-payday
  cancel-in-progress: false

jobs:
  update-payday:
    name: Update Discord Payday Message
    runs-on: ubuntu-latest

    steps:
      - name: Create or update payday announcement
        env:
          WEBHOOK_URL: ${{ secrets.PAYROLL_DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}

        run: |
          node <<'NODE'
          const https = require('https');

          const webhook = process.env.WEBHOOK_URL;
          const repo = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;

          if (!webhook || !token || !repo) {
            throw new Error('Missing webhook, GitHub token, or repository.');
          }

          function request(url, method, headers = {}, body = null) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const data = body ? JSON.stringify(body) : '';

              const req = https.request({
                hostname: u.hostname,
                path: u.pathname + u.search,
                method,
                headers: {
                  'User-Agent': 'Prime-City-Payroll-Bot',
                  ...headers,
                  ...(data ? {
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(data)
                  } : {})
                }
              }, res => {
                let output = '';

                res.on('data', chunk => output += chunk);

                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(
                      `HTTP ${res.statusCode}: ${output}`
                    ));
                  } else {
                    resolve(output);
                  }
                });
              });

              req.on('error', reject);

              if (data) req.write(data);
              req.end();
            });
          }

          function nextPayment() {
            const now = Date.now();

            const formatter = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Africa/Lagos',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              weekday: 'short'
            });

            const parts = Object.fromEntries(
              formatter.formatToParts(new Date())
                .map(p => [p.type, p.value])
            );

            const current = new Date(Date.UTC(
              Number(parts.year),
              Number(parts.month) - 1,
              Number(parts.day)
            ));

            const daysUntilSunday =
              (7 - current.getUTCDay()) % 7;

            const target = new Date(current);

            target.setUTCDate(
              target.getUTCDate() + daysUntilSunday
            );

            // 8 PM WAT = 7 PM UTC
            target.setUTCHours(19, 0, 0, 0);

            if (target.getTime() <= now) {
              target.setUTCDate(target.getUTCDate() + 7);
            }

            return Math.floor(target.getTime() / 1000);
          }

          async function main() {
            const payment = nextPayment();

            const embed = {
              title: '👑 PRIME CITY REAL ESTATE',

              description:
                '**WEEKLY PAYROLL**\n\n' +
                '💰 **PAYMENT FREQUENCY**\n' +
                'Every Sunday\n\n' +
                '📅 **NEXT PAYMENT**\n' +
                `<t:${payment}:F>\n\n` +
                '🕗 **PAYMENT TIME**\n' +
                `<t:${payment}:t> (your local timezone)\n\n` +
                '⏳ **COUNTDOWN TO PAYDAY**\n' +
                `<t:${payment}:R>\n\n` +
                '🔗 **[OPEN PAYROLL PORTAL]' +
                '(https://mayakivalerie2005-cloud.github.io/' +
                'prime-city-realtor-hours/prime-city-agent-payroll/)**',

              color: 14269269,

              footer: {
                text: 'PRIME CITY REAL ESTATE • Weekly Payments'
              },

              timestamp: new Date().toISOString()
            };

            const payload = {
              username: 'PRIME CITY | PAYROLL',
              embeds: [embed]
            };

            const api =
              `https://api.github.com/repos/${repo}/actions/variables`;

            const variableApi =
              `${api}/PAYDAY_MESSAGE_ID`;

            const githubHeaders = {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            };

            let messageId = '';

            // Look for the saved Discord message ID.
            try {
              const result = await request(
                variableApi,
                'GET',
                githubHeaders
              );

              messageId = JSON.parse(result).value;

            } catch (error) {
              if (!String(error.message).includes('HTTP 404')) {
                throw error;
              }
            }

            if (messageId) {
              // Edit the existing Discord message.
              const editUrl =
                webhook.replace(/\/$/, '') +
                `/messages/${messageId}`;

              await request(
                editUrl,
                'PATCH',
                {},
                payload
              );

              console.log('Existing payday message updated.');

            } else {
              // Create the first Discord message.
              const postUrl =
                webhook +
                (webhook.includes('?') ? '&' : '?') +
                'wait=true';

              const result = await request(
                postUrl,
                'POST',
                {},
                payload
              );

              messageId = JSON.parse(result).id;

              if (!messageId) {
                throw new Error(
                  'Discord did not return a message ID.'
                );
              }

              // Save the message ID in GitHub.
              await request(
                api,
                'POST',
                githubHeaders,
                {
                  name: 'PAYDAY_MESSAGE_ID',
                  value: messageId
                }
              );

              console.log(
                'First payday message created and ID saved.'
              );
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
