name: PRIME CITY Official Business Schedule

on:
  workflow_dispatch:

  schedule:
    - cron: '5 23 * * *'

permissions:
  contents: write

concurrency:
  group: prime-city-official-schedule
  cancel-in-progress: false

jobs:
  publish-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Create or update official schedule
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const webhook = process.env.DISCORD_WEBHOOK_URL;
          const idFile = ".github/prime-city-schedule-message-id.txt";

          if (!webhook) {
            throw new Error("Discord webhook secret is missing.");
          }

          const description = [
            "# 👑 PRIME CITY REAL ESTATE",
            "### OFFICIAL BUSINESS HOURS 🏡",
            "",
            "Welcome to PRIME CITY REAL ESTATE!",
            "",
            "Our dedicated real estate team is available during the operating hours listed below to assist with property purchases, sales, viewings and enquiries.",
            "",
            "━━━━━━━━━━━━━━━━━━━━",
            "### 🗓️ WEEKLY OPERATING HOURS",
            "",
            "**MONDAY – SATURDAY**",
            "🟢 Opening: <t:1795424400:t>",
            "🔴 Closing: <t:1795456800:t>",
            "",
            "**SUNDAY**",
            "🟠 Emergency Requests Only",
            "Opening: <t:1795525200:t>",
            "Closing: <t:1795532400:t>",
            "",
            "━━━━━━━━━━━━━━━━━━━━",
            "### ⏰ BUSINESS STATUS",
            "",
            "🟢 **OPEN** — Our real estate agents are available.",
            "",
            "🔴 **CLOSED** — Regular property services are unavailable.",
            "",
            "🟠 **EMERGENCY ONLY** — Urgent property-related matters may be reviewed, subject to staff availability.",
            "",
            "### 🌍 TIMEZONE INFORMATION",
            "",
            "All times are displayed automatically in your local timezone through Discord.",
            "You do not need to calculate time differences or convert the schedule yourself!",
            "",
            "### 📌 IMPORTANT INFORMATION",
            "",
            "• Property enquiries must be submitted through our official ticket system.",
            "• Requests submitted outside operating hours will be handled when business resumes.",
            "• Please respect our agents' working hours.",
            "• Emergency requests are not guaranteed immediate assistance.",
            "",
            "━━━━━━━━━━━━━━━━━━━━",
            "**PRIME CITY REAL ESTATE**",
            "*Where Your Next Chapter Begins.* 👑"
          ].join("\n");

          const embed = {
            description: description,
            color: 0xB22222,
            footer: {
              text: "PRIME CITY REAL ESTATE • OFFICIAL BUSINESS HOURS"
            }
          };

          async function createMessage() {
            const response = await fetch(`${webhook}?wait=true`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                embeds: [embed],
                allowed_mentions: {
                  parse: []
                }
              })
            });

            if (!response.ok) {
              throw new Error(
                "Discord creation failed: " +
                response.status + " " + await response.text()
              );
            }

            return await response.json();
          }

          async function editMessage(id) {
            return await fetch(`${webhook}/messages/${id}`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                embeds: [embed],
                allowed_mentions: {
                  parse: []
                }
              })
            });
          }

          async function main() {
            fs.mkdirSync(".github", { recursive: true });

            let messageId = null;

            if (fs.existsSync(idFile)) {
              messageId = fs.readFileSync(idFile, "utf8").trim();
            }

            if (messageId) {
              const response = await editMessage(messageId);

              if (response.ok) {
                console.log("Official schedule updated successfully.");
                return;
              }

              if (response.status !== 404) {
                throw new Error(
                  "Discord edit failed: " +
                  response.status + " " + await response.text()
                );
              }

              console.log("Previous message not found. Creating replacement.");
            }

            const message = await createMessage();

            if (!message.id) {
              throw new Error("Discord did not return a message ID.");
            }

            fs.writeFileSync(idFile, message.id + "\n");

            console.log("Official business schedule created.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save schedule message ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/prime-city-schedule-message-id.txt

          if ! git diff --cached --quiet; then
            git commit -m "Save PRIME CITY schedule message ID"
            git push
          else
            echo "Schedule message ID already saved."
          fi
