
name: PRIME CITY Official Business Schedule

on:
  workflow_dispatch:

  schedule:
    # Refresh daily at 00:05 WAT (23:05 UTC)
    - cron: '5 23 * * *'

permissions:
  contents: write

concurrency:
  group: prime-city-official-schedule
  cancel-in-progress: false

jobs:
  publish-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Create or update official schedule
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const webhook = process.env.DISCORD_WEBHOOK_URL;
          const tz = "Africa/Lagos";
          const idFile = ".github/prime-city-schedule-message-id.txt";
          const now = new Date();

          if (!webhook) {
            throw new Error("Discord webhook secret is missing.");
          }

          function getParts(date) {
            return Object.fromEntries(
              new Intl.DateTimeFormat("en-GB", {
                timeZone: tz,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                weekday: "short",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23"
              }).formatToParts(date).map(x => [x.type, x.value])
            );
          }

          function localToUTC(y, m, d, h, min) {
            const target = Date.UTC(y, m - 1, d, h, min);
            let result = new Date(target);

            for (let i = 0; i < 3; i++) {
              const p = getParts(result);
              const actual = Date.UTC(
                Number(p.year),
                Number(p.month) - 1,
                Number(p.day),
                Number(p.hour),
                Number(p.minute)
              );

              result = new Date(result.getTime() + target - actual);
            }

            return result;
          }

          // Find the next occurrence of a weekly opening or closing.
          function nextOccurrence(allowedDays, hour) {
            const p = getParts(now);
            const y = Number(p.year);
            const m = Number(p.month);
            const d = Number(p.day);

            for (let offset = 0; offset <= 7; offset++) {
              const date = new Date(Date.UTC(y, m - 1, d + offset));
              const cy = date.getUTCFullYear();
              const cm = date.getUTCMonth() + 1;
              const cd = date.getUTCDate();

              const noon = localToUTC(cy, cm, cd, 12, 0);
              const weekday = getParts(noon).weekday;

              if (!allowedDays.includes(weekday)) continue;

              const candidate = localToUTC(cy, cm, cd, hour, 0);

              if (candidate.getTime() > now.getTime()) {
                return Math.floor(candidate.getTime() / 1000);
              }
            }

            throw new Error("Could not calculate the next schedule time.");
          }

          const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
          const sunday = ["Sun"];

          const weekdayOpen = nextOccurrence(weekdays, 9);
          const weekdayClose = nextOccurrence(weekdays, 18);
          const sundayOpen = nextOccurrence(sunday, 13);
          const sundayClose = nextOccurrence(sunday, 15);

          const description =
            "Welcome to PRIME CITY REAL ESTATE!\n\n" +
            "Our dedicated real estate team is available during the operating hours listed below to assist with property purchases, sales, viewings and enquiries.\n\n" +
            "━━━━━━━━━━━━━━━━━━━━\n\n" +
            "### 🗓️ WEEKLY OPERATING HOURS\n\n" +
            "**MONDAY – SATURDAY**\n" +
            `🟢 Opening: <t:${weekdayOpen}:t>\n` +
            `🔴 Closing: <t:${weekdayClose}:t>\n\n` +
            "**SUNDAY**\n" +
            "🟠 Emergency Requests Only\n" +
            `Opening: <t:${sundayOpen}:t>\n` +
            `Closing: <t:${sundayClose}:t>\n\n` +
            "━━━━━━━━━━━━━━━━━━━━\n\n" +
            "### ⏰ BUSINESS STATUS\n\n" +
            "🟢 **OPEN** — Our real estate agents are available.\n\n" +
            "🔴 **CLOSED** — Regular property services are unavailable.\n\n" +
            "🟠 **EMERGENCY ONLY** — Urgent property-related matters may be reviewed, subject to staff availability.\n\n" +
            "### 🌍 TIMEZONE INFORMATION\n\n" +
            "All times are based on West Africa Time (WAT). Discord automatically displays timestamps in your local timezone.\n\n" +
            "You do not need to calculate time differences or convert the schedule yourself!\n\n" +
            "### 📌 IMPORTANT INFORMATION\n\n" +
            "• Property enquiries must be submitted through our official ticket system.\n" +
            "• Requests submitted outside operating hours will be handled when business resumes.\n" +
            "• Please respect our agents' working hours.\n" +
            "• Emergency requests are not guaranteed immediate assistance.\n\n" +
            "━━━━━━━━━━━━━━━━━━━━\n\n" +
            "**PRIME CITY REAL ESTATE**\n" +
            "*Where Your Next Chapter Begins.* 👑";

          const embed = {
            title: "👑 PRIME CITY REAL ESTATE",
            description,
            color: 0xB22222,
            footer: {
              text: "PRIME CITY REAL ESTATE • OFFICIAL BUSINESS HOURS • WAT"
            },
            timestamp: now.toISOString()
          };

          async function createMessage() {
            const response = await fetch(`${webhook}?wait=true`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                embeds: [embed],
                allowed_mentions: { parse: [] }
              })
            });

            if (!response.ok) {
              throw new Error(
                "Discord creation failed: " + response.status +
                " " + await response.text()
              );
            }

            return await response.json();
          }

          async function editMessage(id) {
            return await fetch(`${webhook}/messages/${id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                embeds: [embed],
                allowed_mentions: { parse: [] }
              })
            });
          }

          async function main() {
            fs.mkdirSync(".github", { recursive: true });

            let messageId = null;

            if (fs.existsSync(idFile)) {
              messageId = fs.readFileSync(idFile, "utf8").trim();
            }

            if (messageId) {
              const response = await editMessage(messageId);

              if (response.ok) {
                console.log("Official schedule updated successfully.");
                return;
              }

              if (response.status !== 404) {
                throw new Error(
                  "Discord edit failed: " + response.status +
                  " " + await response.text()
                );
              }

              console.log("Old schedule message not found. Creating a replacement.");
            }

            const message = await createMessage();

            if (!message.id) {
              throw new Error("Discord did not return a message ID.");
            }

            fs.writeFileSync(idFile, message.id + "\n");
            console.log("Official schedule created successfully.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Save schedule message ID
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/prime-city-schedule-message-id.txt

          if ! git diff --cached --quiet; then
            git commit -m "Save PRIME CITY official schedule message ID"
            git push
          else
            echo "Schedule message ID is already saved."
          fi
